          "knowsAbout": ["Search Engine Optimization", "Answer Engine Optimization", "Generative Engine Optimization", "AI Search", "Entity SEO", "Knowledge Graph Optimization"]
        },
        {
          "@type": "WebSite",
          "@id": "https://nexussearch.ai/#website",
          "url": "https://nexussearch.ai",
          "name": "Nexus Search AI",
          "publisher": {
            "@id": "https://nexussearch.ai/#organization"
          }
        },
        {
          "@type": "Service",
          "name": "Integrated SEO, AEO & GEO Search Visibility",

            "@id": "https://nexussearch.ai/#organization"
          },
          "serviceType": "Digital Marketing & AI Optimization",
          "description": "Comprehensive strategy covering traditional organic search discovery, direct answer snippet extraction, and generative AI platform brand citations."
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is the difference between SEO, AEO and GEO?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "SEO (Search Engine Optimization) focuses on ranking websites in traditional search results (the classic 10 blue links). AEO (Answer Engine Optimization) structures content and schemas so AI engines extract direct answers into featured snippets and voice summaries. GEO (Generative Engine Optimization) optimizes brand relevance, entity authority, and citation frequency within large language models such as ChatGPT, Gemini, Claude, and Perplexity."
              }
            },
            {
              "@type": "Question",
              "name": "Why do I need AEO if I already do SEO?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Traditional SEO targets user clicks from ranking lists. However, modern search experiences increasingly display synthesized answers before or instead of links. Without AEO, competitors who structure their content as direct answers will capture the user's attention even if your page ranks on the first page."
              }
            },
            {
              "@type": "Question",
              "name": "What is Generative Engine Optimization?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Generative Engine Optimization (GEO) is the discipline of optimizing digital presence, authoritative co-citations, and entity data so generative AI models cite and recommend your brand when users request commercial advice or comparisons."
              }
            }
          ]
        }
      ]
    }
